[package]
name = "klosti"
version = "0.1.0"
description = "See every rule, skill, hook and MCP server your coding agents use."
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
tauri = { version = "=2.12.0", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "=2.4.0"
tauri-plugin-notification = "=2.5.0"
tauri-plugin-single-instance = "=2.5.0"
tauri-plugin-autostart = "=2.6.0"
serde_json = "1"

[profile.release]
strip = true
lto = true
